<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <script type="module" src="Journal.js"></script>
        <title>Thesis View</title>
        <style>
           

        </style>
    </head>
    <body>

      <nav
        class="nav-shell"
        aria-label="Main navigation"
    >

        <div class="nav-panel">

            <button
                class="regular-button"
                type="button"
                onclick="window.location.href='JournalHome.html'"
            >
                Dashboard
            </button>

            <button
                id="accessibility-toggle"
                class="regular-button"
                type="button"
                aria-expanded="false"
                aria-controls="accessibility-menu"
            >
                Accessibility Menu
            </button>

        </div>
        
    <!-- Accessibility Menu -->

    <div
        class="Accessibility-Overlay"
        id="accessibility-overlay"
        hidden
    >

        <div
            class="Accessibility"
            id="accessibility-menu"
            role="dialog"
            aria-modal="true"
            aria-labelledby="accessibility-title"
        >

            <div class="Accessibility-Header">

            

                <h2 id="accessibility-title">
                    Accessibility Settings
                </h2>

            </div>

            <div class="Accessibility-Content">

                <label for="text-size-slider">
                    Text Size:
                </label>

                <input
                    type="range"
                    id="text-size-slider"
                    min="80"
                    max="150"
                    value="100"
                    step="10"
                    aria-describedby="text-size-value"
                >

                <span id="text-size-value">
                    100%
                </span>

            </div>

            <div class="Accessibility-Actions">

                <button
                    type="button"
                    class="regular-button"
                    id="accessibility-close"
                >
                    Close
                </button>

            </div>

        </div>

    </div>
    </nav>


        <div class="thesis-view-container">
            <div class="thesis-view-header">
                <div>
                    <h1 class="thesis-view-title" id="ticker-display">--</h1>
                    <p class="thesis-view-subtitle" id="stock-name-display">--</p>
                </div>

                   <div class="thesis-actions">
                        <button class="regular-button" id="edit-thesis">
                            Edit Thesis
                        </button>

                        <button class="regular-button" id="save-thesis" style="display: none;">
                            Save Changes
                        </button>
                    </div>
            </div>

            <!-- Stock Details Section -->
            <div class="thesis-section">
                <div class="thesis-section-title">Stock Details</div>
                <div class="thesis-details-grid">
                    <div class="detail-item">
                        <div class="detail-label">Stock Name</div>
                        <div class="detail-value" id="detail-stock-name">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Ticker</div>
                        <div class="detail-value" id="detail-ticker">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Exchange</div>
                        <div class="detail-value" id="detail-exchange">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Sector</div>
                        <div class="detail-value" id="detail-sector">--</div>
                    </div>
                </div>
            </div>

            <!-- Investment Details Section -->
            <div class="thesis-section">
                <div class="thesis-section-title">Investment Details</div>
                <div class="thesis-details-grid">
                    <div class="detail-item">
                        <div class="detail-label">Entry Price</div>
                        <div class="detail-value" id="detail-entry-price">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Target Price</div>
                        <div class="detail-value" id="detail-target-price">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Stop Loss</div>
                        <div class="detail-value" id="detail-stop-loss">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Position Size</div>
                        <div class="detail-value" id="detail-position-size">--</div>
                    </div>
                </div>
            </div>

            <!-- Thesis Analysis Section -->
            <div class="thesis-section">
                <div class="thesis-section-title">Thesis Analysis</div>
                
                <div class="thesis-text-section">
                    <div class="detail-label">Bull Case</div>
                    <p id="detail-bull-case">--</p>
                </div>

                <div class="thesis-text-section">
                    <div class="detail-label">Bear Case</div>
                    <p id="detail-bear-case">--</p>
                </div>
            </div>

            <!-- Confidence & Notes Section -->
            <div class="thesis-section">
                <div class="thesis-section-title">Confidence & Notes</div>
                <div class="thesis-details-grid">
                    <div class="detail-item">
                        <div class="detail-label">Confidence Level</div>
                        <div class="detail-value" id="detail-confidence">--</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Date Added</div>
                        <div class="detail-value" id="detail-date">--</div>
                    </div>
                </div>
                
                <div class="thesis-text-section" style="margin-top: 20px;">
                    <div class="detail-label">Additional Notes</div>
                    <p id="detail-notes">--</p>
                </div>
            </div>
        </div>

     
    </body>
</html>
